<div class="container mt-4">
  <div class="mat-elevation-z8 mb-4">
    <table mat-table [dataSource]="projects" class="w-100">

      <!-- Proyecto -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Proyecto </th>
        <td mat-cell *matCellDef="let project"> {{project.name}} </td>
      </ng-container>

      <!-- Cliente -->
      <ng-container matColumnDef="client">
        <th mat-header-cell *matHeaderCellDef> Cliente </th>
        <td mat-cell *matCellDef="let project"> {{project.client}} </td>
      </ng-container>

      <!-- Estado -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let project">
          <span class="badge" 
                [ngClass]="{'bg-success': project.status === 'Finalizado', 
                            'bg-warning': project.status === 'Progreso', 
                            'bg-danger': project.status === 'Atrasado'}">
            {{project.status}}
          </span>
        </td>
      </ng-container>

      <!-- Progreso -->
      <ng-container matColumnDef="progress">
        <th mat-header-cell *matHeaderCellDef> Progreso </th>
        <td mat-cell *matCellDef="let project">
          <mat-progress-bar mode="determinate" [value]="project.progress"></mat-progress-bar>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
